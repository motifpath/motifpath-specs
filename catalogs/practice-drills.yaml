# MotifPath practice drill catalog v2 — the drill templates, the generated fretboard cells,
# the diagram shape families and the timed thresholds installed in every environment. Rules: practice-drills.md.
#
# IDs are UUID v5 under the catalog namespace, from "drill-template/<key>" and
# "drill-threshold/<template key>/v<version>" (reference-data.md).

# Every template names its rung on the practice ladder: know, hear, play_clean, play_in_time,
# move, target, use. A generated template asked among options names its second_way: the other
# template that asks the same item, so a lucky guess meets the other way (ADR-057).
templates:
  - {key: "fretboard_cell:name_the_note", rung: know, second_way: "fretboard_cell:find_the_note", item_kind: fretboard_cell, response_type: name_the_note, timed: true, names: {en: "Name the note", pt_BR: "Diga a nota"}, id: 4c6ffb77-ee8b-5fda-b243-784f4209bc65}
  - {key: "fretboard_cell:find_the_note", rung: know, second_way: "fretboard_cell:name_the_note", item_kind: fretboard_cell, response_type: find_the_note, timed: true, names: {en: "Find the note", pt_BR: "Ache a nota"}, id: 6e38da0b-df26-5aa8-ab14-3b6640582174}
  - {key: "diagram_shape:name_the_shape", rung: know, second_way: "diagram_shape:find_the_degree", item_kind: diagram_shape, response_type: name_the_shape, timed: true, names: {en: "Name the shape", pt_BR: "Diga a forma"}, id: 30abb724-d181-56d0-8255-889411531213}
  - {key: "diagram_shape:find_the_degree", rung: know, second_way: "diagram_shape:name_the_shape", item_kind: diagram_shape, response_type: find_the_degree, timed: true, names: {en: "Find the degree", pt_BR: "Ache o grau"}, id: c11e550e-1612-5414-ba78-298e158700d0}
  - {key: "exercise:text_response", rung: know, item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Text exercises", pt_BR: "Exercícios de texto"}, id: eee88cdc-8c03-5246-b798-3ccf6941875f}
  - {key: "exercise:audio_recognition", rung: hear, item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Listening exercises", pt_BR: "Exercícios de escuta"}, id: e11fdaf6-8f60-5348-ab8b-0333cb31c31f}
  - {key: "exercise:image_recognition", rung: know, item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Image recognition exercises", pt_BR: "Exercícios de reconhecimento de imagem"}, id: bfe9f72d-a2e9-5f43-a774-115b7da268f8}
  - {key: "exercise:image_choice", rung: know, item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Image choice exercises", pt_BR: "Exercícios de escolha de imagem"}, id: 2ba4103e-ce5d-554f-83a5-eba38a6ed2b6}
  - {key: "exercise:audio_selection", rung: hear, item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Sound choice exercises", pt_BR: "Exercícios de escolha de som"}, id: 49aed57b-3886-53de-b6d1-4b842acc8ab1}
  - {key: "diatonic_chord:numeral_to_chord", rung: know, second_way: "diatonic_chord:chord_to_numeral", item_kind: diatonic_chord, response_type: generated_choice, timed: true, names: {en: "Numeral to chord", pt_BR: "Do grau ao acorde"}, id: b4a81a0e-1141-5139-a06a-6f2c7b0341ea}
  - {key: "diatonic_chord:chord_to_numeral", rung: know, second_way: "diatonic_chord:numeral_to_chord", item_kind: diatonic_chord, response_type: generated_choice, timed: true, names: {en: "Chord to numeral", pt_BR: "Do acorde ao grau"}, id: cc7434af-9b59-5675-b90f-b340cd2ba8d3}
  - {key: "chord_function:chord_to_function", rung: know, second_way: "chord_function:function_to_chord", item_kind: chord_function, response_type: generated_choice, timed: true, names: {en: "Chord to function", pt_BR: "Do acorde à função"}, id: a1c08e82-68e2-5d3c-8844-5a79599fc4f3}
  - {key: "chord_function:function_to_chord", rung: know, second_way: "chord_function:chord_to_function", item_kind: chord_function, response_type: generated_choice, timed: true, names: {en: "Function to chord", pt_BR: "Da função ao acorde"}, id: b0f8fd07-9310-5b17-acb1-77070529421d}
  - {key: "chart_progression:chart_to_numbers", rung: know, second_way: "chart_progression:numbers_to_chart", item_kind: chart_progression, response_type: generated_choice, timed: true, names: {en: "Read the chart", pt_BR: "Ler a cifra"}, id: 259ed951-c50c-5331-a2de-8475fda08106}
  - {key: "chart_progression:numbers_to_chart", rung: know, second_way: "chart_progression:chart_to_numbers", item_kind: chart_progression, response_type: generated_choice, timed: true, names: {en: "Pick the chart", pt_BR: "Escolher a cifra"}, id: d63bfeed-3175-5b8a-a838-f543cec550ce}

# Which generated fretboard cells serve which skill, per fretboard layout. A layout is
# named by its layout instrument; instruments with the same geometry share it (guitar and
# electric-guitar share "guitar"). Strings count from 1, the highest-pitched. Every cell is
# asked through both fretboard_cell templates.
fretboard_cells:
  - skill: find-notes-root-strings
    layouts:
      guitar: {strings: [6, 5], frets: [0, 11]}
      electric-bass: {strings: [4, 3], frets: [0, 11]}
  - skill: find-notes-top-strings
    layouts:
      guitar: {strings: [4, 3, 2, 1], frets: [0, 11]}
      electric-bass: {strings: [2, 1], frets: [0, 11]}

# Which catalog diagrams are practised as shapes in the head. A family takes the catalog
# diagrams whose key matches its pattern (the keys of basic-guitar-diagrams.md's generator);
# the {shape} part names the member the diagram is, and members are listed in the order a
# name_the_shape question offers them. A shape is one item per diagram, keyed by its diagram
# id, and rolls up to its diagram's skill and concept. Every shape is asked through both
# diagram_shape templates.
diagram_shapes:
  - family: caged-grip
    diagrams: "caged/{root}/{shape}/{shift}"
    names: {en: "CAGED grips", pt_BR: "Formas do CAGED"}
    members:
      - {shape: "C", names: {en: "C shape", pt_BR: "Forma de C"}}
      - {shape: "A", names: {en: "A shape", pt_BR: "Forma de A"}}
      - {shape: "G", names: {en: "G shape", pt_BR: "Forma de G"}}
      - {shape: "E", names: {en: "E shape", pt_BR: "Forma de E"}}
      - {shape: "D", names: {en: "D shape", pt_BR: "Forma de D"}}
  - family: major-pentatonic-box
    diagrams: "pentatonic-box/major-pentatonic/{root}/{shape}/{fret}"
    names: {en: "Major pentatonic boxes", pt_BR: "Desenhos da pentatônica maior"}
    members:
      - {shape: "1", names: {en: "Box 1", pt_BR: "Desenho 1"}}
      - {shape: "2", names: {en: "Box 2", pt_BR: "Desenho 2"}}
      - {shape: "3", names: {en: "Box 3", pt_BR: "Desenho 3"}}
      - {shape: "4", names: {en: "Box 4", pt_BR: "Desenho 4"}}
      - {shape: "5", names: {en: "Box 5", pt_BR: "Desenho 5"}}
  - family: minor-pentatonic-box
    diagrams: "pentatonic-box/minor-pentatonic/{root}/{shape}/{fret}"
    names: {en: "Minor pentatonic boxes", pt_BR: "Desenhos da pentatônica menor"}
    members:
      - {shape: "1", names: {en: "Box 1", pt_BR: "Desenho 1"}}
      - {shape: "2", names: {en: "Box 2", pt_BR: "Desenho 2"}}
      - {shape: "3", names: {en: "Box 3", pt_BR: "Desenho 3"}}
      - {shape: "4", names: {en: "Box 4", pt_BR: "Desenho 4"}}
      - {shape: "5", names: {en: "Box 5", pt_BR: "Desenho 5"}}
  - family: triad
    diagrams: "arpeggio/{shape}-triad/{root}/frets-0-12"
    names: {en: "Triads", pt_BR: "Tríades"}
    members:
      - {shape: "major", names: {en: "Major triad", pt_BR: "Tríade maior"}}
      - {shape: "minor", names: {en: "Minor triad", pt_BR: "Tríade menor"}}
      - {shape: "diminished", names: {en: "Diminished triad", pt_BR: "Tríade diminuta"}}
      - {shape: "augmented", names: {en: "Augmented triad", pt_BR: "Tríade aumentada"}}
  - family: major-scale-window
    diagrams: "caged-window/major/{root}/{shape}/{shift}"
    names: {en: "Major scale windows", pt_BR: "Regiões da escala maior"}
    members:
      - {shape: "C", names: {en: "C shape window", pt_BR: "Região da forma de C"}}
      - {shape: "A", names: {en: "A shape window", pt_BR: "Região da forma de A"}}
      - {shape: "G", names: {en: "G shape window", pt_BR: "Região da forma de G"}}
      - {shape: "E", names: {en: "E shape window", pt_BR: "Região da forma de E"}}
      - {shape: "D", names: {en: "D shape window", pt_BR: "Região da forma de D"}}
  - family: natural-minor-scale-window
    diagrams: "caged-window/natural-minor/{root}/{shape}/{shift}"
    names: {en: "Natural minor scale windows", pt_BR: "Regiões da escala menor natural"}
    members:
      - {shape: "C", names: {en: "C shape window", pt_BR: "Região da forma de C"}}
      - {shape: "A", names: {en: "A shape window", pt_BR: "Região da forma de A"}}
      - {shape: "G", names: {en: "G shape window", pt_BR: "Região da forma de G"}}
      - {shape: "E", names: {en: "E shape window", pt_BR: "Região da forma de E"}}
      - {shape: "D", names: {en: "D shape window", pt_BR: "Região da forma de D"}}

