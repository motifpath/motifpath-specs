# MotifPath practice drill catalog v1 — the drill templates, the generated fretboard cells
# and the timed thresholds installed in every environment. Rules: practice-drills.md.
#
# IDs are UUID v5 under the catalog namespace, from "drill-template/<key>" and
# "drill-threshold/<template key>/v<version>" (reference-data.md).

templates:
  - {key: "fretboard_cell:name_the_note", item_kind: fretboard_cell, response_type: name_the_note, timed: true, names: {en: "Name the note", pt_BR: "Diga a nota"}, id: 4c6ffb77-ee8b-5fda-b243-784f4209bc65}
  - {key: "fretboard_cell:find_the_note", item_kind: fretboard_cell, response_type: find_the_note, timed: true, names: {en: "Find the note", pt_BR: "Ache a nota"}, id: 6e38da0b-df26-5aa8-ab14-3b6640582174}
  - {key: "exercise:text_response", item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Text exercises", pt_BR: "Exercícios de texto"}, id: eee88cdc-8c03-5246-b798-3ccf6941875f}
  - {key: "exercise:audio_recognition", item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Listening exercises", pt_BR: "Exercícios de escuta"}, id: e11fdaf6-8f60-5348-ab8b-0333cb31c31f}
  - {key: "exercise:image_recognition", item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Image recognition exercises", pt_BR: "Exercícios de reconhecimento de imagem"}, id: bfe9f72d-a2e9-5f43-a774-115b7da268f8}
  - {key: "exercise:image_choice", item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Image choice exercises", pt_BR: "Exercícios de escolha de imagem"}, id: 2ba4103e-ce5d-554f-83a5-eba38a6ed2b6}
  - {key: "exercise:audio_selection", item_kind: exercise, response_type: option_choice, timed: true, names: {en: "Sound choice exercises", pt_BR: "Exercícios de escolha de som"}, id: 49aed57b-3886-53de-b6d1-4b842acc8ab1}

# Which generated fretboard cells serve which skill, per fretboard layout. A layout is
# named by its layout instrument; instruments with the same geometry share it (guitar and
# electric-guitar share "guitar"). Strings count from 1, the highest-pitched. Every cell is
# asked through both fretboard_cell templates.
fretboard_cells:
  - skill: find-notes-root-strings
    layouts:
      guitar: {strings: [6, 5], frets: [0, 11]}
      electric-bass: {strings: [4, 3], frets: [0, 11]}
  - skill: find-notes-top-strings
    layouts:
      guitar: {strings: [4, 3, 2, 1], frets: [0, 11]}
      electric-bass: {strings: [2, 1], frets: [0, 11]}

# Versioned fluent times, net of the student's tap time (and, for exercises with audio, of the
# audio heard once). Adjust a fluent time by adding a version with a later effective_from; never
# edit an installed one. Every template starts from a team-set default (source: default); the
# team benchmark on the fretboard drills is their version 2.
thresholds:
  - {template: "exercise:text_response", version: 1, effective_from: "2026-10-01", fluent_net_ms: 6000, source: default, sessions: 0, students: 0, id: a2ccf5a4-31e5-5aac-991d-5b17904b4ea8}
  - {template: "exercise:audio_recognition", version: 1, effective_from: "2026-10-01", fluent_net_ms: 4000, source: default, sessions: 0, students: 0, id: e0364add-6753-58c3-a781-a9589288510e}
  - {template: "exercise:image_recognition", version: 1, effective_from: "2026-10-01", fluent_net_ms: 5000, source: default, sessions: 0, students: 0, id: 1fa82f45-7f4f-51ee-b974-cf0673eda4a7}
  - {template: "exercise:image_choice", version: 1, effective_from: "2026-10-01", fluent_net_ms: 5000, source: default, sessions: 0, students: 0, id: c8d7f798-4ab0-57cb-bf26-5f477154ae87}
  - {template: "exercise:audio_selection", version: 1, effective_from: "2026-10-01", fluent_net_ms: 4000, source: default, sessions: 0, students: 0, id: 61b55338-dee3-5391-b556-dc8fe121ea6d}
  - {template: "fretboard_cell:name_the_note", version: 1, effective_from: "2026-10-01", fluent_net_ms: 3000, source: default, sessions: 0, students: 0, id: bf63ad0e-f1c7-52ba-a303-230472134f6c}
  - {template: "fretboard_cell:find_the_note", version: 1, effective_from: "2026-10-01", fluent_net_ms: 4000, source: default, sessions: 0, students: 0, id: b4038212-bd6e-5749-8b39-cc8862e1974e}
