  - {key: minor-11-e-shape, quality: minor_11, shape_family: e_shape, root_string: 6, difficulty: advanced, technique_tags: [partial_barre],
     strings: {6: [0, "3"], 4: [0, "3"], 3: [0, "4"], 2: [-2, "1"], 1: [-2, "1"]}}
  - {key: dominant-13-e-shape, quality: dominant_13, shape_family: e_shape, root_string: 6, difficulty: advanced, technique_tags: [],
     strings: {6: [0, "1"], 4: [0, "2"], 3: [1, "3"], 2: [2, "4"]}}
  # ── Root on string 5 ──
  - {key: major-a-shape, quality: major, shape_family: a_shape, root_string: 5, difficulty: intermediate, technique_tags: [barre],
     strings: {5: [0, "1"], 4: [2, "3"], 3: [2, "3"], 2: [2, "3"], 1: [0, "1"]}}
  - {key: minor-a-shape, quality: minor, shape_family: a_shape, root_string: 5, difficulty: intermediate, technique_tags: [barre],
     strings: {5: [0, "1"], 4: [2, "3"], 3: [2, "4"], 2: [1, "2"], 1: [0, "1"]}}
  - {key: power-a-shape, quality: power, shape_family: a_shape, root_string: 5, difficulty: beginner, technique_tags: [],
     strings: {5: [0, "1"], 4: [2, "3"], 3: [2, "4"]}}
  - {key: sus2-a-shape, quality: sus2, shape_family: a_shape, root_string: 5, difficulty: intermediate, technique_tags: [barre],
