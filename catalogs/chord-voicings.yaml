     strings: {6: [0, "1"], 4: [1, "3"], 3: [1, "4"], 2: [0, "2"]}}
  - {key: minor-7-e-shape, quality: minor_7, shape_family: e_shape, root_string: 6, difficulty: intermediate, technique_tags: [barre],
