# MotifPath chord catalog v1 — chord formulas, movable shape templates and hand-authored open
# voicings for standard-tuning six-string guitar. Rules: chord-voicings.md.
#
# Strings count from 1, the highest-pitched (E4), to 6 (E2). A string a voicing doesn't list is
# muted. Each listed string is [fret, finger] or [fret] for an open string. Template frets are
# offsets from the root fret on the template's root string. Fingers: "1" index to "4" little, or
# "thumb".
#
# IDs are UUID v5 under the catalog namespace, from "chord-definition/<canonical symbol>",
# "chord-template/<key>" and "chord-voicing/<template key>/<root>" or "chord-voicing/<open key>"
# (reference-data.md). The generator writes them; they are not listed here.

tuning: [E2, A2, D3, G3, B3, E4]

# The 12 roots every quality is defined on, spelled as the catalog spells them.
roots: [C, Db, D, Eb, E, F, F#, G, Ab, A, Bb, B]

# Every chord quality: its tones above the root, and which of them a voicing may leave out.
formulas:
  major:              {intervals: [R, "3", "5"], omittable: []}
  minor:              {intervals: [R, b3, "5"], omittable: []}
  power:              {intervals: [R, "5"], omittable: []}
  diminished:         {intervals: [R, b3, b5], omittable: []}
  augmented:          {intervals: [R, "3", "#5"], omittable: []}
  sus2:               {intervals: [R, "2", "5"], omittable: []}
  sus4:               {intervals: [R, "4", "5"], omittable: []}
  major_6:            {intervals: [R, "3", "5", "6"], omittable: ["5"]}
  minor_6:            {intervals: [R, b3, "5", "6"], omittable: ["5"]}
  dominant_7:         {intervals: [R, "3", "5", b7], omittable: ["5"]}
  major_7:            {intervals: [R, "3", "5", "7"], omittable: ["5"]}
  minor_7:            {intervals: [R, b3, "5", b7], omittable: ["5"]}
  minor_major_7:      {intervals: [R, b3, "5", "7"], omittable: ["5"]}
  half_diminished_7:  {intervals: [R, b3, b5, b7], omittable: []}
  diminished_7:       {intervals: [R, b3, b5, bb7], omittable: []}
  dominant_7_sus4:    {intervals: [R, "4", "5", b7], omittable: ["5"]}
  add_9:              {intervals: [R, "3", "5", "9"], omittable: []}
  minor_add_9:        {intervals: [R, b3, "5", "9"], omittable: []}
  dominant_9:         {intervals: [R, "3", "5", b7, "9"], omittable: ["5"]}
  major_9:            {intervals: [R, "3", "5", "7", "9"], omittable: ["5"]}
  minor_9:            {intervals: [R, b3, "5", b7, "9"], omittable: ["5"]}
  dominant_11:        {intervals: [R, "3", "5", b7, "9", "11"], omittable: ["3", "5", "9"]}
  minor_11:           {intervals: [R, b3, "5", b7, "9", "11"], omittable: ["5", "9"]}
  dominant_13:        {intervals: [R, "3", "5", b7, "9", "13"], omittable: ["5", "9"]}
  dominant_7_flat_5:  {intervals: [R, "3", b5, b7], omittable: []}
  dominant_7_sharp_5: {intervals: [R, "3", "#5", b7], omittable: []}
  dominant_7_flat_9:  {intervals: [R, "3", "5", b7, b9], omittable: ["5"]}
  dominant_7_sharp_9: {intervals: [R, "3", "5", b7, "#9"], omittable: ["5"]}

# Movable shapes. Each is materialized once per root (chord-voicings.md, Templates).
templates:
  # ── Root on string 6 ──
  - {key: major-e-shape, quality: major, shape_family: e_shape, root_string: 6, difficulty: intermediate, technique_tags: [barre],
     strings: {6: [0, "1"], 5: [2, "3"], 4: [2, "4"], 3: [1, "2"], 2: [0, "1"], 1: [0, "1"]}}
  - {key: minor-e-shape, quality: minor, shape_family: e_shape, root_string: 6, difficulty: intermediate, technique_tags: [barre],
     strings: {6: [0, "1"], 5: [2, "3"], 4: [2, "4"], 3: [0, "1"], 2: [0, "1"], 1: [0, "1"]}}
  - {key: power-e-shape, quality: power, shape_family: e_shape, root_string: 6, difficulty: beginner, technique_tags: [],
     strings: {6: [0, "1"], 5: [2, "3"], 4: [2, "4"]}}
  - {key: sus4-e-shape, quality: sus4, shape_family: e_shape, root_string: 6, difficulty: intermediate, technique_tags: [barre],
     strings: {6: [0, "1"], 5: [2, "2"], 4: [2, "3"], 3: [2, "4"], 2: [0, "1"], 1: [0, "1"]}}
