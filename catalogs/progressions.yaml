# MotifPath progression catalog v1 — the common chord progressions, by number, that harmony and
# ear drills ask about. Rules: progressions.md.
#
# Numerals are in a major key: I ii iii IV V vi vii°; a 7 marks a dominant seventh (I7). Each
# entry is one bar per numeral. "confusable" lists the progressions a learner mistakes it for;
# it is symmetric, and drills offer them as distractors.
#
# IDs are UUID v5 under the catalog namespace, from "progression/<key>" (reference-data.md).

