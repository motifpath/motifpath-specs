# MotifPath knowledge map v1 — the reviewed skill/concept graph installed in every
# environment. Rules, scope and acceptance: knowledge-map.md.
#
# instruments: all = every instrument (empty instrument_ids); any other value is an
#              alias below for an explicit list of catalog instruments.
# level: typical calibration (B beginner, EI early intermediate, I intermediate,
#        A advanced boundary); levels: per-instrument override. Annotations for
#        authors only; not installed.

instruments:
  guitars: [acoustic-guitar, electric-guitar]
  electric: [electric-guitar]
  acoustic: [acoustic-guitar]
  bass: [electric-bass]
  fretted: [acoustic-guitar, electric-guitar, electric-bass]
  bass-acoustic: [acoustic-guitar, electric-bass]

