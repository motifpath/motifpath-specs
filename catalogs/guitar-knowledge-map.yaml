# Guitar knowledge map v1 — the reviewed skill/concept graph installed in every
# environment. Rules, scope and acceptance: guitar-knowledge-map.md.
#
# instruments: all = every instrument (empty instrument_ids)
#              guitars = Guitar + Electric guitar
#              electric = Electric guitar only
# level: typical calibration (B beginner, EI early intermediate, I intermediate,
#        A advanced boundary). Annotation for authors only; not installed.

