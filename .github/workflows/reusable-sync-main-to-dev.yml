name: Reusable — Sync main → dev (and stage)

# Opens a PR from main into each long-lived branch that main must flow back
# into: `dev` always, and `stage` in the repositories that have it (the
# deployable ones). Without the `stage` sync, a hotfix merged to main would be
# missing from the next release candidate, and promoting that `stage` to main
# would ship a release without it. Callers stay unchanged; a repository with
# no `stage` branch skips that target.

on:
  workflow_call:

jobs:
  sync:
    name: Open sync PR from main to ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: [dev, stage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if main is ahead of ${{ matrix.target }}
        id: check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$TARGET" >/dev/null; then
            echo "No $TARGET branch in this repository. Skipping."
            echo "commits_ahead=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$TARGET"
          BEHIND=$(git rev-list "origin/$TARGET..origin/main" --count)
          echo "commits_ahead=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq "0" ]; then
            echo "$TARGET is already up to date with main. Skipping."
          fi

      # The PR's head is a branch at main's head, not main itself: merging it
      # (and the automatic deletion of a merged PR's branch) never touches
      # main. While its PR is open the branch only moves forward, so conflict
      # fixes pushed to it are kept.
      - name: Open or update the sync PR (main → ${{ matrix.target }})
        if: steps.check.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          branch="chore/sync-main-to-$TARGET"
          existing=$(gh pr list --base "$TARGET" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            git push origin "origin/main:refs/heads/$branch" \
              || echo "::warning::$branch has commits main does not (a conflict fix?); left as it is"
            echo "Sync PR already open: $existing"
            exit 0
          fi
          # No open PR uses the branch, so any copy left from an earlier sync is spent.
          git push --force origin "origin/main:refs/heads/$branch"
          url=$(gh pr create --base "$TARGET" --head "$branch" \
            --title "chore: sync main → $TARGET" \
            --body "$(cat <<EOF
          ## Automated sync — main → $TARGET

          This PR was opened automatically after a merge to \`main\`.
          It keeps \`$TARGET\` in sync with any hotfix or release that landed on \`main\`.

          **Review before merging:**
          - [ ] No unintended changes included
          - [ ] Conflicts resolved correctly (if any)
          - [ ] CI passes
          - [ ] Merged with a merge commit, not squash

          > This PR was created by the \`sync-main-to-dev\` reusable workflow
          > defined in \`motifpath-specs\`.
          EOF
          )")
          echo "Opened $url"
          gh pr edit "$url" --add-label automated --add-label sync >/dev/null 2>&1 \
            || echo "::notice::labels automated/sync not added (missing in this repository?)"
