name: Validate Specs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-openapi:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Lint OpenAPI specs
        run: npx @redocly/cli lint openapi/*.yaml

  validate-gherkin:
    name: Validate Gherkin Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Parse and validate feature files
        run: |
          find features -name '*.feature' -print0 | while IFS= read -r -d '' feature; do
            echo "Validating $feature..."
            npx @cucumber/gherkin-streams "$feature" > /dev/null
          done

  validate-golden:
    name: Validate Golden Cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Validate grader golden cases against their schema and the practice contract
        run: npm run validate:golden

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [validate-openapi, validate-gherkin, validate-golden]
    steps:
      - run: echo "All spec validations passed"
