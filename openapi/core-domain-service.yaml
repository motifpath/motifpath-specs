openapi: 3.1.0

info:
  title: Core Domain Service
  version: 0.13.0
  license:
    name: Proprietary — MotifPath internal use only
    identifier: UNLICENSED
  description: |
    Manages the MotifPath core domain: user identity, content (nodes, challenges,
    exercises), learning paths, and student progress state.

    This service is the authoritative source for all domain entities referenced by
    other services. The Event Ingestion Service validates student identity against
    user records created here. All content IDs carried in tracking events
    (content_node_id, challenge_id, exercise_id) must exist in this service before
    events that reference them are meaningful.

servers:
  - url: https://api.motifpath.io/v1
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

paths:
  /users:
    post:
      operationId: registerUser
      summary: Register an authenticated user
      description: |
        Creates a MotifPath user record for the authenticated Clerk identity. The
        caller supplies their intended role (student or teacher); the service maps
        the JWT sub claim to a new user_id and persists the record.

        The user's display name is taken from the "name" claim of the Clerk
        session token (trimmed, at most 200 characters), never from the
        request body. A token without a non-blank name claim is rejected
        with 400 on field "name". On every later authenticated request the
        stored name is refreshed when the claim differs from it; a missing
        or blank claim on a later request leaves the stored name unchanged.

        This endpoint must be called once per Clerk identity before any other
        authenticated operation. Subsequent calls with the same JWT sub return 409.

        The user_id returned in the response is the stable MotifPath identity for
        this user. Students must use this value as the student_id field in all
        tracking events submitted to the Event Ingestion Service.
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              register_student:
                summary: A new student registers
                value:
                  role: student
              register_teacher:
                summary: A new teacher registers
                value:
                  role: teacher
      responses:
        "201":
          description: |
            User registered. Returns the new user's stable MotifPath identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "400":
          description: |
            The request is invalid. The role field is missing or contains an
            unrecognised value (field "role"), or the session token carries no
            non-blank name claim (field "name").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: |
            Missing or invalid Bearer token. The caller must be authenticated via
            Clerk before registering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "409":
          description: |
            A user record already exists for this Clerk identity. Each Clerk
            account can be registered only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

  /content-nodes:
    get:
      operationId: listContentNodes
      summary: List content nodes for authoring
      description: |
        Returns content nodes from the library, for browsing and picking one
        to edit, use as a remediation target, or add to a learning path —
        not a student-facing catalog.
        Results are paginated (ADR-031): ordered by title, then id and
        returned in a {items, total, limit, offset} envelope. An offset
        past the end returns an empty items array, not an error.
        Only teachers and admins may list content nodes.
      tags:
        - Content
      parameters:
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: content_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - video
              - article
          description: When given, only content nodes of this type are returned.
        - name: skill_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When given, only content nodes with this exact skill id among their linked skills are returned. Matches that node only, not its ancestors or descendants.
        - name: concept_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When given, only content nodes with this exact concept id among their linked concepts are returned. Matches that node only, not its ancestors or descendants.
        - name: difficulty_level
          in: query
          required: false
          schema:
            type: string
            enum:
              - beginner
              - early_intermediate
              - intermediate
              - advanced
              - expert
          description: When given, only content nodes at this difficulty level are returned.
      responses:
        "200":
          description: One page of the matching content nodes, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedContentNodes'
        "400":
          description: limit or offset is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to list content
            nodes. Only teachers and admins may list content nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

    post:
      operationId: createContentNode
      summary: Create a content node
      description: |
        Creates a new content node owned by the authenticated teacher or admin.
        A content node is the base unit of a class — a video or article that a
        student consumes on their learning path.

        Classification (skills, concepts, difficulty level) must be supplied at
        creation time. The review_state is always set to pending on creation
        regardless of the value supplied; an admin must explicitly confirm it.
        Classification is the minimum semantic layer required for gap detection
        to function.

        The node's actual content is supplied by exactly one of media_url
        (video) or rich_content (article), matching content_type — these are
        mutually exclusive and whichever matches content_type is required. A
        diagram is not a content node type of its own — embed one inline in
        rich_content via a PromptNode, or attach it as an ExpandedContent
        item, either alongside media_url or rich_content.
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentNodeRequest'
            examples:
              video_lesson:
                summary: A teacher publishes a video lesson on triad shapes
                value:
                  title: "Introduction to Triad Shapes"
                  content_type: video
                  classification:
                    skill_ids: ["3f4b6f2a-8c3e-4b1a-9d2e-7a1c5f0e9b21"]
                    concept_ids: ["7a2d9e10-4f3b-4c5a-8e6d-1b2c3d4e5f60"]
                    difficulty_level: beginner
                  media_url: "https://cdn.motifpath.io/videos/triad-shapes-intro.mp4"
                  language_codes:
                    - en
      responses:
        "201":
          description: Content node created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNode'
        "400":
          description: The request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to create content.
            Only teachers and admins may create content nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /content-nodes/{content_node_id}:
    get:
      operationId: getContentNode
      summary: Get a content node by ID
      description: |
        Returns the content node with the given ID. Any authenticated user
        (student, teacher, or admin) may retrieve a content node.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node to retrieve.
      responses:
        "200":
          description: The requested content node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNode'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "404":
          description: No content node exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      operationId: updateContentNode
      summary: Update a content node's title and classification
      description: |
        Replaces the given content node's title and classification with the
        request body. content_type cannot be changed — it determines which
        expanded-content trigger fields (seconds vs. paragraph) are valid for
        items already attached to this node, so changing it would leave those
        items in an inconsistent shape; publish a new content node of the
        desired type instead. review_state is not affected by this call — an
        edit does not reset or require re-confirming an admin's prior review.
        Only the creating teacher or an admin may update a content node.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentNodeRequest'
      responses:
        "200":
          description: The updated content node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNode'
        "400":
          description: The request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to update this
            content node. Only the creating teacher or an admin may update it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No content node exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /content-nodes/{content_node_id}/publish:
    post:
      operationId: publishContentNode
      summary: Publish a content node's current draft
      description: |
        Snapshots the content node's current reader-facing state — title,
        classification, and whichever of media_url or rich_content applies,
        plus languages — into
        a new immutable ContentNodeVersion, and advances the node's
        latest_published_version to it. Every future copy of an item
        referencing this node (into a StudentPathItem, at assignment,
        enrollment, or checkpoint advance) resolves to this version
        until a newer one is published. Already-copied StudentPathItems
        keep the version they were copied at; they are never
        retargeted. Same authorisation as content node authoring — not
        admin-only, since nodes are not student-browsable the way a
        course is.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node to publish.
      responses:
        "201":
          description: The new ContentNodeVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentNodeVersion'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            Only the creating teacher or an admin may publish this
            content node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No content node exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /content-nodes/{content_node_id}/versions:
    get:
      operationId: listContentNodeVersions
      summary: List a content node's published version history
      description: |
        Returns every ContentNodeVersion the node has ever been
        published as, newest first. A node that has never been
        published returns an empty array. Same authorisation as
        publishing — the creating teacher or an admin.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node whose history to list.
      responses:
        "200":
          description: The node's versions, newest first, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentNodeVersion'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            Only the creating teacher or an admin may view this
            content node's version history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No content node exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /content-nodes/{content_node_id}/challenges:
    get:
      operationId: listContentNodeChallenges
      summary: List the challenges attached to a content node
      description: |
        Returns the challenges attached to the specified content node, so a client
        can discover whether a node has a practice step before linking into it. A
        node with no challenge returns an empty array — completion for that node
        comes from its content alone. Any authenticated user may list a node's
        challenges.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node whose challenges are requested.
      responses:
        "200":
          description: The content node's challenges, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "404":
          description: No content node exists with the given content_node_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    post:
      operationId: createChallenge
      summary: Create a challenge for a content node
      description: |
        Creates a new challenge attached to the specified content node. A challenge
        is the assessment unit for a class — it groups exercises and carries the
        subject (a Skill or Concept reference) and pass threshold used by the
        rules-based recommendation engine, plus an optional, purely informational
        time threshold.

        A subject is mandatory — exactly one of subject_skill_id/subject_concept_id,
        referencing one of the parent content node's linked skill_ids/concept_ids.
        Without it, right/wrong outcomes on exercises are analytically meaningless
        and gap detection cannot function. Remediation targets are configured per
        exercise, not on the challenge — see Exercise.remediation_targets.
      tags:
        - Content
      parameters:
        - name: content_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the content node this challenge belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
            examples:
              chord_recognition:
                summary: A challenge for chord recognition with an explicit time threshold
                value:
                  subject_skill_id: "3f4b6f2a-8c3e-4b1a-9d2e-7a1c5f0e9b21"
                  pass_threshold: 70
                  time_threshold_ms: 120000
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        "400":
          description: The request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to create challenges.
            Only teachers and admins may create challenges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No content node exists with the given content_node_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /challenges/{challenge_id}:
    get:
      operationId: getChallenge
      summary: Get a challenge by ID
      description: |
        Returns the challenge with the given ID. Any authenticated user may
        retrieve a challenge.
      tags:
        - Content
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the challenge to retrieve.
      responses:
        "200":
          description: The requested challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "404":
          description: No challenge exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      operationId: updateChallenge
      summary: Update a challenge's assessment configuration
      description: |
        Replaces the given challenge's subject tag, pass threshold, time
        threshold, and shuffle flags with the request body. The challenge's
        linked exercises are untouched by this call — use POST/DELETE
        /challenges/{challenge_id}/exercises/{exercise_id} to change those.
        Remediation targets are configured per exercise, not on the
        challenge — see updateExercise. Only the creating teacher or an
        admin may update a challenge.
      tags:
        - Content
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the challenge to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeRequest'
      responses:
        "200":
          description: The updated challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        "400":
          description: The request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to update this
            challenge. Only the creating teacher or an admin may update it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No challenge exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /exercises:
    get:
      operationId: listExercises
      summary: List standalone exercises for authoring
      description: |
        Returns exercises from the reusable pool, for browsing and picking one
        to edit in an authoring tool — not the randomized, skill-targeted
        selection GET /practice-sessions performs for a student's practice
        attempt.
        Results are paginated (ADR-031): ordered by id and
        returned in a {items, total, limit, offset} envelope. An offset
        past the end returns an empty items array, not an error.
        Only teachers and admins may list exercises; the pool is an
        authoring surface, not a student-facing catalog.
      tags:
        - Content
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: skill_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            When given, only exercises linked to this exact skill id are
            returned.
        - name: exercise_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - text_response
              - audio_recognition
              - image_recognition
              - image_choice
              - audio_selection
          description: When given, only exercises of this type are returned.
      responses:
        "200":
          description: One page of the matching exercises, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedExercises'
        "400":
          description: limit or offset is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to list exercises.
            Only teachers and admins may list exercises.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

    post:
      operationId: createExercise
      summary: Create a standalone exercise
      description: |
        Creates a reusable exercise, independent of any challenge. An exercise
        is a single practice item, checked by option selection: the student's
        selected option ID(s) must match the option(s) marked is_correct. The
        exercise_id returned is the value the SPA must supply in
        exercise-family tracking events. Link the exercise into one or more
        challenges afterward with
        POST /challenges/{challenge_id}/exercises/{exercise_id}.
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
            examples:
              image_recognition:
                summary: A fretboard region identification exercise
                value:
                  title: "Root position of a C major triad"
                  prompt:
                    type: doc
                    content:
                      - type: paragraph
                        content:
                          - type: text
                            text: "Identify the root position of a C major triad"
                  exercise_type: image_recognition
                  skill_ids:
                    - "3f4b6f2a-8c3e-4b1a-9d2e-7a1c5f0e9b21"
                  concept_ids:
                    - "7a2d9e10-4f3b-4c5a-8e6d-1b2c3d4e5f60"
                  image_url: "https://cdn.example.com/fretboard/c-major-triad.png"
                  options:
                    - option_id: "e1a1a1a1-0000-0000-0000-000000000001"
                      is_correct: true
                      region:
                        x: 0.2
                        y: 0.3
                        width: 0.1
                        height: 0.1
                        shape: rectangle
                    - option_id: "e1a1a1a1-0000-0000-0000-000000000002"
                      is_correct: false
                      region:
                        x: 0.5
                        y: 0.3
                        width: 0.1
                        height: 0.1
                        shape: rectangle
                  language_codes:
                    - any
      responses:
        "201":
          description: Exercise created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        "400":
          description: |
            The request body failed schema validation, or no option has
            is_correct set to true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to create exercises.
            Only teachers and admins may create exercises.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /practice-sessions:
    get:
      operationId: startPracticeSession
      summary: Start a randomized, skill-targeted practice session
      description: |
        Selects up to count exercises linked to skill_id from the reusable
        exercise pool, in random order with each exercise's options also
        shuffled, and returns them grouped under a new practice_session_id.
        A practice session is not a stored resource — nothing is persisted by
        this call, and repeating it returns a different selection and a new
        practice_session_id. The returned exercises include which option(s)
        are correct, on the same client-side-scoring basis as challenge
        exercises.

        This is the entry point for a student's self-directed practice
        between lessons — for example on a commute or a work break — rather
        than practice tied to a specific content node. The client threads the
        returned practice_session_id through the trigger_context of the
        exercise.* tracking events it emits while attempting the session, so
        the recommendation engine can evaluate outcomes per skill.

        Any authenticated user may start a practice session.
      tags:
        - Content
      parameters:
        - name: skill_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The Skill to select exercises for.
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: |
            The number of exercises requested. The response may contain fewer
            if the exercise pool linked to skill_id is smaller than count.
      responses:
        "200":
          description: The generated practice session, possibly with fewer exercises than requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        "400":
          description: skill_id was omitted, not a valid uuid, or count was outside 1-50.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /challenges/{challenge_id}/exercises:
    get:
      operationId: listChallengeExercises
      summary: List the exercises linked to a challenge
      description: |
        Returns the exercises currently linked to the specified challenge, in the
        shape a client needs to run a practice attempt — each exercise's prompt,
        type, and options, including which option(s) are correct. Any authenticated
        user may list a challenge's exercises; the client is responsible for
        withholding correctness from the student's own view while the attempt is
        in progress and using it only to score the attempt once submitted.

        Exercise and option order follow the challenge's shuffle_exercises and
        shuffle_options settings — when either is true, that ordering is
        randomized fresh on every call and is not stable across requests.
      tags:
        - Content
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the challenge whose exercises are requested.
      responses:
        "200":
          description: The challenge's linked exercises, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "404":
          description: No challenge exists with the given challenge_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /challenges/{challenge_id}/exercises/{exercise_id}:
    post:
      operationId: linkExerciseToChallenge
      summary: Link an existing exercise to a challenge
      description: |
        Links an existing, standalone exercise into the specified challenge.
        The same exercise may be linked to any number of challenges — linking
        it into a second challenge does not duplicate the exercise or affect
        its other links.
      tags:
        - Content
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the challenge to link the exercise into.
        - name: exercise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the exercise to link.
      responses:
        "201":
          description: Exercise linked. Returns the updated exercise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to link exercises.
            Only teachers and admins may link exercises to challenges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: No challenge exists with challenge_id, or no exercise exists with exercise_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        "409":
          description: The exercise is already linked to this challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

    delete:
      operationId: unlinkExerciseFromChallenge
      summary: Unlink an exercise from a challenge
      description: |
        Removes the link between the specified exercise and challenge. The
        exercise itself is not deleted and remains linked to any other
        challenges it is part of.
      tags:
        - Content
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the challenge to unlink the exercise from.
        - name: exercise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the exercise to unlink.
      responses:
        "204":
          description: Exercise unlinked.
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        "403":
          description: |
            The authenticated user does not have permission to unlink exercises.
            Only teachers and admins may unlink exercises from challenges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        "404":
          description: |
            No challenge exists with challenge_id, no exercise exists with
            exercise_id, or the exercise is not currently linked to this
            challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /content-nodes/{content_node_id}/exercises:
    get:
      operationId: listContentNodePathExercises
      summary: List a content node's path exercises
      description: |
        Returns the exercises linked to the specified content node as path
        exercises — the static, teacher-curated introductory practice for that
        node. Unlike a challenge, a path exercise is not an assessment: it
        carries no pass threshold and is always returned in link order, never
        shuffled. Any authenticated user may list a node's path exercises.
      tags:
