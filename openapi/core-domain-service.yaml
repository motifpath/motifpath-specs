                $ref: '#/components/schemas/UnauthorizedError'
        "404":
          description: No content node exists with the given content_node_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /content-nodes/{content_node_id}/exercises/{exercise_id}:
    post:
      operationId: linkExerciseToContentNode
      summary: Link an existing exercise to a content node as a path exercise
      description: |
