TrackingEventBase:
  type: object
  description: |
    Common envelope carried by every student tracking event emitted by the Vue 3 SPA.
    All event-specific schemas extend this base via allOf. Consumers use event_type to
    route; event_id enables idempotent processing under at-least-once Kafka delivery.
  properties:
    event_id:
      type: string
      format: uuid
      description: |
        Client-generated unique identifier for this event occurrence. The Aggregation Worker
        must key idempotency checks on event_id to safely handle duplicate deliveries from
        the Kafka consumer group.
    event_type:
      type: string
      enum:
        - lesson.started
        - lesson.resumed
        - lesson.completed
        - exercise.started
        - exercise.progress
        - exercise.ended
        - practice.session_started
        - practice.item_answered
        - practice.session_ended
        - practice.tap_check_completed
        - song_chart.opened
        - song_chart.chord_viewed
        - song_chart.completed
      description: |
        Discriminator field. Determines which event-specific payload fields are present.
        The set of valid values is closed — adding a new event type requires a spec change
        and a new ADR if it introduces a new consumer concern.
    student_id:
      type: string
      format: uuid
      description: |
        ID of the authenticated student who generated this event. Used as the Kafka
        partition key — guarantees ordered delivery of all events for a given student
        to the same partition and consumer.
    session_id:
      type: string
      format: uuid
      description: |
        Identifies the student's active browser session. Generated by the frontend at
        session start and carried on all events until the page is reloaded or the session
        expires. Enables session-scoped aggregation in the Aggregation Worker.
    occurred_at:
      type: string
      format: date-time
      description: |
        Client-side timestamp at which the event occurred, in ISO 8601 format with UTC
        offset. Stored as-is by the Event Ingestion Service. Server-side ingestion time
        is recorded separately and is not part of the event payload.
  required:
    - event_id
    - event_type
    - student_id
    - session_id
    - occurred_at

TrackingEvent:
  description: |
    A student tracking event submitted by the Vue 3 SPA to the Event Ingestion Service.
    Exactly one event-specific schema applies, discriminated by event_type. The Event
    Ingestion Service persists the raw payload to MongoDB and publishes it to the
    motifpath.events Kafka topic.
  discriminator:
    propertyName: event_type
    mapping:
      lesson.started: '#/LessonStartedEvent'
      lesson.resumed: '#/LessonResumedEvent'
      lesson.completed: '#/LessonCompletedEvent'
      exercise.started: '#/ExerciseStartedEvent'
      exercise.progress: '#/ExerciseProgressEvent'
      exercise.ended: '#/ExerciseEndedEvent'
      practice.session_started: '#/PracticeSessionStartedEvent'
      practice.item_answered: '#/PracticeItemAnsweredEvent'
      practice.session_ended: '#/PracticeSessionEndedEvent'
      practice.tap_check_completed: '#/PracticeTapCheckCompletedEvent'
      song_chart.opened: '#/SongChartOpenedEvent'
      song_chart.chord_viewed: '#/SongChartChordViewedEvent'
      song_chart.completed: '#/SongChartCompletedEvent'
  oneOf:
    - $ref: '#/LessonStartedEvent'
    - $ref: '#/LessonResumedEvent'
    - $ref: '#/LessonCompletedEvent'
    - $ref: '#/ExerciseStartedEvent'
    - $ref: '#/ExerciseProgressEvent'
    - $ref: '#/ExerciseEndedEvent'
    - $ref: '#/PracticeSessionStartedEvent'
    - $ref: '#/PracticeItemAnsweredEvent'
    - $ref: '#/PracticeSessionEndedEvent'
    - $ref: '#/PracticeTapCheckCompletedEvent'
    - $ref: '#/SongChartOpenedEvent'
    - $ref: '#/SongChartChordViewedEvent'
    - $ref: '#/SongChartCompletedEvent'

ContentContext:
  type: object
  description: |
    Contextual metadata about the ContentNode the student is engaging with. Required on
    all lesson events. The object is open (additionalProperties allowed) to accommodate
    future metadata fields without a schema bump; all currently known properties are
    documented here. Consumers must treat undocumented keys as opaque.
  properties:
    content_node_id:
      type: string
      format: uuid
      description: ID of the ContentNode the student started, resumed, or completed.
    content_type:
      type: string
      enum:
        - video
        - article
      description: |
        Media format of the content node. Mirrors ContentNode.content_type. Included in
        the event payload to avoid a lookup at aggregation time.
    teacher_id:
      type: string
      format: uuid
      description: |
        ID of the teacher who published this content node. Enables teacher-scoped
        engagement analytics without a join at query time.
  additionalProperties: true
  required:
    - content_node_id

TriggerContext:
  type: object
  description: |
    Describes the context in which an exercise was initiated. Required on all exercise
    events, and on practice.item_answered when the answer is given outside a practice
    session. Enables downstream analytics to distinguish spontaneous practice from
    assessment-driven and remediation-driven exercises.
  properties:
    source:
      type: string
      enum:
        - challenge_sequence
        - path_exercise
        - free_practice
        - remediation
      description: |
        What triggered this exercise session. challenge_sequence = part of a
        node's challenge; path_exercise = one of a node's static,
        teacher-curated introductory exercises; free_practice = student
        initiated independently, outside any of the above; remediation =
        surfaced by the recommendation engine as a remediation target.
    content_node_id:
      type: string
      format: uuid
      description: |
        ID of the ContentNode in whose context the exercise was triggered. Present when
        source is challenge_sequence, path_exercise, or remediation. Absent for
        free_practice, which is not tied to a single node.
    challenge_id:
      type: string
      format: uuid
      description: |
        ID of the Challenge this exercise belongs to. Present only when source is
        challenge_sequence. Enables per-challenge scoring in the Aggregation Worker.
  additionalProperties: false
  required:
    - source

LessonStartedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student navigates to and begins engaging with a ContentNode for
        the first time in a session. Distinct from lesson.resumed, which fires on
        re-entering a node already started in a prior session.
      properties:
        event_type:
          type: string
          enum:
            - lesson.started
        content_context:
          $ref: '#/ContentContext'
      required:
        - event_type
        - content_context

LessonResumedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student returns to a ContentNode they previously started but did
        not complete. One resume event per re-entry in a new session.
      properties:
        event_type:
          type: string
          enum:
            - lesson.resumed
        content_context:
          $ref: '#/ContentContext'
      required:
        - event_type
        - content_context

LessonCompletedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student marks a ContentNode as complete or the platform determines
        completion by its configured criteria. Triggers prerequisite checking for
        subsequent nodes in the learning path.
      properties:
        event_type:
          type: string
          enum:
            - lesson.completed
        content_context:
          $ref: '#/ContentContext'
        duration_seconds:
          type: integer
          minimum: 0
          description: |
            Total time the student spent on this ContentNode in this session, in seconds.
            Client-computed from session start to completion event. Used for engagement
            analytics. Omitted if the client cannot determine session duration reliably
            (e.g., tab was backgrounded for an unknown duration).
      required:
        - event_type
        - content_context

ExerciseStartedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student begins an exercise attempt. Marks the start of an attempt
        session. Always paired with exercise.ended, which marks the conclusion.
      properties:
        event_type:
          type: string
          enum:
            - exercise.started
        exercise_id:
          type: string
          format: uuid
          description: ID of the exercise being attempted.
        trigger_context:
          $ref: '#/TriggerContext'
      required:
        - event_type
        - exercise_id
        - trigger_context

ExerciseProgressEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted periodically during an active exercise attempt to signal continued
        engagement. Frequency is determined by the client. Used to distinguish active
        practice sessions from abandoned ones where exercise.ended was never emitted.
      properties:
        event_type:
          type: string
          enum:
            - exercise.progress
        exercise_id:
          type: string
          format: uuid
          description: ID of the exercise in progress.
        trigger_context:
          $ref: '#/TriggerContext'
        elapsed_seconds:
          type: integer
          minimum: 0
          description: |
            Time elapsed since the corresponding exercise.started event, in seconds.
            Client-computed. Helps the Aggregation Worker detect paused sessions and
            compute actual active-practice time per exercise.
      required:
        - event_type
        - exercise_id
        - trigger_context

ExerciseEndedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when an exercise attempt session ends, regardless of outcome. Always paired
        with exercise.started. If the client crashes before emitting this event, the
        Aggregation Worker infers abandonment after a configurable inactivity timeout.
      properties:
        event_type:
          type: string
          enum:
            - exercise.ended
        exercise_id:
          type: string
          format: uuid
          description: ID of the exercise whose attempt just ended.
        trigger_context:
          $ref: '#/TriggerContext'
        outcome:
          type: string
          enum:
            - completed
            - abandoned
          description: |
            How the exercise attempt concluded. completed = student submitted a final
            answer and explicitly finished; abandoned = student left without completing.
            The Aggregation Worker uses outcome to compute completion rates per challenge.
        final_score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Score percentage (0–100) for this attempt, as computed by the client based
            on the answers submitted. Present only when outcome is completed. Used by
            the Aggregation Worker to evaluate against the Challenge threshold and
            determine whether a remediation recommendation should be surfaced.
      required:
        - event_type
        - exercise_id
        - trigger_context
        - outcome

PracticeSessionStartedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student starts a composed practice session. Carries the plan as it
        was offered, with the reason for every item, so the session composer's choices can
        be compared with what the student went on to answer. The plan is not stored
        anywhere else.
      properties:
        event_type:
          type: string
          enum:
            - practice.session_started
        practice_session_id:
          type: string
          format: uuid
          description: |
            Identifier of this practice session, carried by every practice.* event the
            session produces. Distinct from session_id, which identifies the browser session.
        instrument_id:
          type: string
          format: uuid
          description: |
            The instrument in the student's hands for this session. Absent when the session
            is practised in the head, without an instrument.
        minutes:
          type: integer
          minimum: 1
          maximum: 60
          description: The time the student chose for the session, in minutes.
        planned_items:
          type: array
          minItems: 1
          items:
            $ref: './practice.yaml#/PlannedPracticeItem'
          description: The session's items, in the order offered, each with why it was picked.
      required:
        - event_type
        - practice_session_id
        - minutes
        - planned_items

PracticeItemAnsweredEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student answers one practice item: a note named or found, exercise
        options selected, or a take rated. Carries the raw response only. The server grades
        it and keeps the result as evidence of what the student knows; a response the
        grader rejects is kept as an event but yields no evidence. The event_id identifies
        the evidence, so a redelivered event counts once. Never sent for the takes of a
        warm_up item, which are played below the student's edge and are not evidence.

        An answer belongs to exactly one context: a practice session (practice_session_id)
        or an exercise answered elsewhere on the platform, such as a node's challenge
        (trigger_context). Answers count the same wherever they are given. Outside a
        practice session, an exercise's answer is the selection the student moves on with
        (to the next exercise, or to finish), sent once per exercise each time the student
        works through it. Selecting, deselecting or changing options before moving on is not
        an answer, and changing a selection after going back is not a new one: a later
        selection may follow what the student learned since, so it is not evidence of what
        they knew. latency_ms runs from the moment the exercise was shown to moving on, or,
        when the options are sounds, from the end of the last clip played.

        An item that couldn't be answered (its sound or image failed to load and the student
        skipped it, or it can't be shown on this device) sends a not_answered response with
        its reason instead. It is kept as an event and yields no evidence.
      properties:
        event_type:
          type: string
          enum:
            - practice.item_answered
        practice_session_id:
          type: string
          format: uuid
          description: |
            The practice session this answer belongs to. Absent when trigger_context is
            present.
        trigger_context:
          $ref: '#/TriggerContext'
        item_key:
          $ref: './practice.yaml#/PracticeItemKey'
        response:
          $ref: './practice.yaml#/PracticeResponse'
        tap_ms:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            The student's tap time, in milliseconds, from their latest tap check before this
            answer: how long a tap takes them when they already know where to tap. Set by the
            server on timed answers (those with a latency_ms) when the student has done a tap
            check; absent otherwise. A value sent by a client is ignored.
      required:
        - event_type
        - item_key
        - response
      oneOf:
        - required:
            - practice_session_id
        - required:
            - trigger_context

PracticeSessionEndedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted once when a practice session ends: the student finished the plan, left the
        session inside the app, or closed or reloaded the page. Carries how the session's
        timed drills felt, when the student was asked. On a page close it's sent as best
        effort and can be lost, for example when the phone discards a background tab. A
        session that never sends it counts as abandoned once no practice event for it has
        arrived for its planned minutes plus 15. It then ended early, at its last event. A
        later event for the session means the student came back, so the session is open
        again.
      properties:
        event_type:
          type: string
          enum:
            - practice.session_ended
        practice_session_id:
          type: string
          format: uuid
          description: The practice session that ended.
        answered_count:
          type: integer
          minimum: 0
          description: |
            How many items the student answered in the session. Items sent as not answered
            (skipped because they couldn't be shown) are not counted.
        left_early:
          type: boolean
          description: |
            True when the session ended before its last planned item: the student left it
            inside the app, or closed or reloaded the page.
        felt_ratings:
          type: array
          maxItems: 2
          items:
            $ref: './practice.yaml#/FeltRating'
          description: |
            The student's answers to "How did it feel?" for at most two of the session's
            timed drills. Empty when the session asked none, or the student skipped them.
      required:
        - event_type
        - practice_session_id
        - answered_count
        - left_early
        - felt_ratings

PracticeTapCheckCompletedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student completes the tap check: about 20 seconds of tapping a
        highlighted fret as soon as it lights up. It measures how long a tap takes the
        student on their device when there is nothing to work out, so timed drills can judge
        the time spent knowing the answer apart from the time spent tapping it.
      properties:
        event_type:
          type: string
          enum:
            - practice.tap_check_completed
        median_tap_ms:
          type: integer
          minimum: 0
          description: The median time from a fret lighting up to the student's tap, in milliseconds.
        tap_count:
          type: integer
          minimum: 1
          description: How many taps the median was taken over.
      required:
        - event_type
        - median_tap_ms
        - tap_count

SongChartContext:
  type: object
  description: |
    The song chart revision a song_chart event happened in. Required on every song_chart
    event, so a reading is tied to the exact lyrics and chords the student saw.
  properties:
    song_chart_id:
      type: string
      format: uuid
      description: ID of the song chart being read.
    revision_number:
      type: integer
      minimum: 1
      description: The published revision being read, as returned with the chart.
  additionalProperties: false
  required:
    - song_chart_id
    - revision_number

SongChartOpenedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student opens a published song chart in the reader, once per
        opening. Reopening the chart later emits it again.
      properties:
        event_type:
          type: string
          enum:
            - song_chart.opened
        song_chart_context:
          $ref: '#/SongChartContext'
      required:
        - event_type
        - song_chart_context

SongChartChordViewedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student taps a chord in a song chart and its voicing sheet opens.
        Switching voicings or playbacks inside the open sheet emits nothing more.
      properties:
        event_type:
          type: string
          enum:
            - song_chart.chord_viewed
        song_chart_context:
          $ref: '#/SongChartContext'
        anchor_id:
          type: string
          minLength: 1
          maxLength: 64
          description: The anchorId of the chord the student tapped.
        chord_definition_id:
          type: string
          format: uuid
          description: The catalog chord the tapped anchor resolves to.
        chord_voicing_id:
          type: string
          format: uuid
          description: The voicing the sheet opened on.
      required:
        - event_type
        - song_chart_context
        - anchor_id
        - chord_definition_id
        - chord_voicing_id

SongChartCompletedEvent:
  allOf:
    - $ref: '#/TrackingEventBase'
    - type: object
      description: |
        Emitted when a student marks a song chart as played, with the reader's "I played it"
        control. Marking it again in the same opening emits nothing.
      properties:
        event_type:
          type: string
          enum:
            - song_chart.completed
        song_chart_context:
          $ref: '#/SongChartContext'
      required:
        - event_type
        - song_chart_context
