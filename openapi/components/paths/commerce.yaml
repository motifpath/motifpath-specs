    operationId: createMyCommercialCheckout
    summary: Start a permanent purchase or teacher-license checkout
    description: "Use only eligible current offer_id; reject stale offers with 409. Bind customer,
      seller, scope, manifest and immutable price/commission revision before provider work. For a
      purchase already held, return 409; concurrent acquisitions reserve one holder/product scope
      across keys. For licenses, require authenticated owning teacher, independent of Plus.
      Account/Connect capability and liquidity prerequisites must pass before taking payment.
      Browser return never confirms payment; verify and fulfill once through the payment profile.
      Every commercial mutation is durably coupled to audit evidence; uncertain external outcomes
      remain pending. Acquisition OFF never disables existing obligations. "
    tags:
      - Commerce
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
          conflicting intent returns 409. Persist identity and attempts beyond provider cache
          lifetime; concurrent business uniqueness spans keys and actors.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/Checkout
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "403":
        description: Caller lacks the authoritative role/ownership or new action is disabled.
        content:
          application/json:
            schema:
              $ref: ../../core-domain-service.yaml#/components/schemas/ForbiddenError
      "404":
        $ref: ./subscriptions.yaml#/NotFound
