Release:
  post:
    operationId: publishCommercialRelease
    summary: Freeze validated commercial dependency references
    description: Registered owner or admin only. Validate existing content revision and complete
      transitive dependency graph, reject cycles, missing rights, stale critical metadata and
      unsupported third-party dependencies. Platform premium exercises in a paid teacher path
      require its teacher/path permanent license; a student subscription is insufficient. Check each
      referenced revision. Concurrent same-intent publication creates one immutable manifest. This
      operation does not publish a path, alter course checkpoints or update learner copies; existing
      authoring/update endpoints retain their semantics. A changed manifest invalidates new-sale
      validation until rechecked.
    tags:
      - Commerce
    parameters:
      - name: content_kind
        in: path
        required: true
        description: Existing core content kind.
        schema:
