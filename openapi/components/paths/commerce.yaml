Content:
  get:
    operationId: getCommercialContent
    summary: Read authoritative commercial content
    description: Registered content owner or admin only; other callers receive 404. content_kind must be
      course, path, content_node or exercise. Public editorial metadata is not ownership proof.
    tags:
      - Commerce
    parameters:
      - name: content_kind
        in: path
        required: true
        description: Existing core content kind.
        schema:
          type: string
          minLength: 1
          enum:
            - course
            - path
            - content_node
            - exercise
      - name: content_id
        in: path
        required: true
        description: Stable core content identity.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/CommercialContent
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "404":
        $ref: ./subscriptions.yaml#/NotFound
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
Sale:
  post:
    operationId: changeCommercialSaleState
    summary: Change free, paid or withdrawn commercial state
    description: Require registered owner or admin and matching expected_revision. Allowed content_kind
      is course or path. Free-to-paid and price/withdrawal changes retain actor, prior/resulting
      state and immutable references. Paid requires validated transitive rights and valid configured
      offers. Do not modify existing buyer grants/copies or auto-update learners. CMS hints cannot
      invoke this authority. Every commercial mutation is durably coupled to audit evidence;
      uncertain external outcomes remain pending. Acquisition OFF never disables existing
      obligations.  Existing free grants are grandfathered explicitly; paid conversion never creates
      an unrequested charge or silently removes their granted access.
    tags:
      - Commerce
    parameters:
      - name: content_kind
        in: path
        required: true
        description: Existing core content kind.
        schema:
          type: string
          minLength: 1
          enum:
            - course
            - path
      - name: content_id
        in: path
        required: true
        description: Stable core content identity.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
          conflicting intent returns 409. Persist identity and attempts beyond provider cache
          lifetime; concurrent business uniqueness spans keys and actors.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/Command
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "403":
        description: Caller lacks the authoritative role/ownership or new action is disabled.
        content:
          application/json:
            schema:
              $ref: ../../core-domain-service.yaml#/components/schemas/ForbiddenError
      "404":
        $ref: ./subscriptions.yaml#/NotFound
      "409":
        $ref: ./subscriptions.yaml#/Conflict
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/commerce.yaml#/ChangeSale
Publish:
