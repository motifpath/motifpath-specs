      content:
        application/json:
          schema:
            $ref: ../schemas/commerce.yaml#/CreateOffer
Offers:
  get:
    operationId: listCommercialOffers
    summary: List eligible one-time acquisition offers
    description: Require kind and path_id. kind must be path_purchase or embedding_license. Resolve
      caller eligibility and approved offers server-side; return empty items if
      acquisition/configuration/prerequisites are unavailable. A disabled currency or malformed kind
      returns 400. A missing path returns 404. Do not expose a teacher license offer as student
      content access. Path-purchase offers require sale_state paid; withdrawn/free paths are not
      sold. A teacher may acquire an eligible path embedding license before enabling that path for
      paid sales.
    tags:
      - Commerce
    parameters:
      - name: kind
        in: query
        required: true
        description: Requested one-time product family.
        schema:
          type: string
          minLength: 1
          enum:
            - path_purchase
            - embedding_license
      - name: path_id
        in: query
        required: true
        description: Target path.
        schema:
          type: string
          format: uuid
      - name: currency
        in: query
        required: true
        description: Enabled currency.
        schema:
          type: string
          pattern: ^[A-Z]{3}$
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/OfferList
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "404":
        $ref: ./subscriptions.yaml#/NotFound
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
Checkouts:
