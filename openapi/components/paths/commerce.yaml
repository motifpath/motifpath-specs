RetryRefund:
  post:
    operationId: retryFailedFullRefund
    summary: Retry a definitively failed refund as an administrator
    description: Admin only. Require failed case at expected_revision and authoritative reconciliation
      proving no prior successful/pending refund or competing dispute return. Unknown outcomes
      remain processing and return 409. Reuse case/business identity, retain original execution
      evidence and append a distinct attributable retry attempt; never replace prior history. A new
      key alone cannot authorize another refund. Check original eligibility or approved review, then
      apply the existing full refund execution invariants. Same-intent retries return recorded state
      before revision checks. Acquisition OFF cannot disable support.
    tags:
      - Commerce
    parameters:
      - name: refund_request_id
        in: path
        required: true
        description: Existing admin-handled refund case.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
          conflicting intent returns 409. Persist identity and attempts beyond provider cache
          lifetime; concurrent business uniqueness spans keys and actors.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative recorded result; pending never claims external success.
        content:
          application/json:
            schema:
              $ref: ../schemas/refunds.yaml#/RefundRequest
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "403":
        description: Caller lacks the authoritative role/ownership or new action is disabled.
        content:
          application/json:
            schema:
              $ref: ../../core-domain-service.yaml#/components/schemas/ForbiddenError
      "404":
        $ref: ./subscriptions.yaml#/NotFound
      "409":
        $ref: ./subscriptions.yaml#/Conflict
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/refunds.yaml#/ExecuteRefundRequest
Payments:
  get:
    operationId: listMyCommercialPayments
    summary: List successful payments for refund/support references
    description: Return only authenticated caller-owned verified payments across subscription, purchase
      and license acquisitions, including refunded payments whose original facts remain unchanged.
      Refund status is read from its case; a refund does not delete the original payment. No
      payer-controlled owner filter. Acquisition OFF never hides receipts. Safe provider references
      are not payment credentials. This read does not create grants or refunds.
    tags:
      - Commerce
    parameters:
      - $ref: ../../core-domain-service.yaml#/components/parameters/Limit
      - $ref: ../../core-domain-service.yaml#/components/parameters/Offset
    responses:
      "200":
        description: Authoritative caller-visible records.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/PaymentPage
      "400": &a1
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401": &a2
        $ref: ./subscriptions.yaml#/Unauthenticated
      "404": &a3
        $ref: ./subscriptions.yaml#/NotFound
      "503": &a4
        $ref: ./subscriptions.yaml#/Unavailable
HistoricalRelease:
  get:
    operationId: getCommercialRelease
    summary: Read an authorized immutable commercial manifest
    description: Owner/admin or a holder whose existing purchase/license/copy references the release
      only. Other callers receive 404. Resolve historical immutable references after withdrawal;
      never substitute the latest manifest. This read does not deliver protected lesson content or
      update the caller copy.
    tags:
      - Commerce
    parameters:
      - name: release_id
        in: path
        required: true
        description: Immutable commercial manifest identity.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative caller-visible records.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/Release
      "400": *a1
      "401": *a2
      "404": *a3
      "503": *a4
CurrentConfiguration:
  get:
    operationId: getCurrentCommercialConfiguration
    summary: Read the current authoritative commercial configuration
    description: Backend-resolved administrator only. Return the currently promoted immutable
      configuration and its revision. Before first configuration return 404; new sales remain
      disabled. Never expose credentials. Acquisition OFF does not hide administrative configuration
      history from authorized roles.
    tags:
      - Commerce
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/Configuration
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "403":
        description: Caller lacks the authoritative role/ownership or new action is disabled.
        content:
          application/json:
            schema:
              $ref: ../../core-domain-service.yaml#/components/schemas/ForbiddenError
      "404":
        $ref: ./subscriptions.yaml#/NotFound
      "409":
        $ref: ./subscriptions.yaml#/Conflict
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
