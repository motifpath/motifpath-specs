SubscriptionOfferConfig:
  post:
    operationId: createSubscriptionOfferRevision
    summary: Create an authoritative subscription offer revision
    description: Admin only. Require current valid commercial configuration and positive
      enabled-currency amount. Annual price must be lower than twelve monthly payments for the same
      scope/currency; create the monthly baseline first. Immutable offer snapshots preserve prior
      payments and accepted checkout terms. Existing subscriptions adopt approved price changes at
      next renewal only, with the configured annual notices. Duplicate commands return the existing
      revision; new intentional prices use a new identity. Audit failure prevents change.
    tags:
      - Commerce
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
