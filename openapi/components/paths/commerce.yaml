Configuration:
  post:
    operationId: createCommercialConfiguration
    summary: Record immutable platform pricing and allocation configuration
    description: Admin only. Validate teacher minimum <= maximum and matching configured currency;
      reject nonpositive or impossible prices. Changes create a new immutable revision and never
      alter historical offer/checkout terms. No sales before a complete valid configuration.
      Subscription prices and annual discounts are represented by immutable monthly/annual offer
      revisions; this endpoint does not create them. Configuration is never taken from CMS. Every
      commercial mutation is durably coupled to audit evidence; uncertain external outcomes remain
      pending. Acquisition OFF never disables existing obligations.  Serialize environment
      configuration promotion using expected_revision (zero only before first configuration); stale
      concurrent edits return 409.
    tags:
      - Commerce
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
          conflicting intent returns 409. Persist identity and attempts beyond provider cache
          lifetime; concurrent business uniqueness spans keys and actors.
        schema:
          type: string
          format: uuid
    responses:
