ReviewRefund:
  post:
    operationId: reviewFullRefundEligibility
    summary: Record an explicit admin refund review
    description: Backend-resolved admin only; matching expected_revision and case requiring review.
      approve_full_refund records explicit approved-policy/statutory justification and permits the
      existing full execution endpoint; it does not return money or revoke access. decline retains
      the case and reason without claiming commercially eligible status. No partial refund is
      executed here. Repeat review uses the same durable operation, conflicting disposition/revision
      returns 409. A declined case can be reviewed again only with new explicit evidence and current
      revision. Uncertain external financial outcomes cannot be overridden by review.
    tags:
      - Commerce
    parameters:
      - name: refund_request_id
        in: path
        required: true
