    summary: Create an immutable one-time offer revision
    description: "Owner may price only their own teacher path within configured bounds; only admin may
      price platform embedding licenses. content_kind must be path. Validate positive price, enabled
      currency, release/dependency rights, expected_revision and platform configuration. New
      revisions never rewrite accepted checkout snapshots. Existing subscription offer endpoints
      retain their distinct scope/period semantics. Every commercial mutation is durably coupled to
      audit evidence; uncertain external outcomes remain pending. Acquisition OFF never disables
      existing obligations. "
    tags:
      - Commerce
    parameters:
      - name: content_kind
        in: path
        required: true
        description: Existing core content kind.
        schema:
          type: string
          minLength: 1
          enum:
            - path
      - name: content_id
        in: path
        required: true
        description: Stable core content identity.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped by trusted environment, actor, action and resource. Fingerprint canonical
          full intent. Same identity/intent returns recorded status before stale-revision checks;
          conflicting intent returns 409. Persist identity and attempts beyond provider cache
          lifetime; concurrent business uniqueness spans keys and actors.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Authoritative result; command pending is not completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/Offer
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
