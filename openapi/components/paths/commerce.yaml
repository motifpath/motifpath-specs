            schema:
              $ref: ../schemas/commerce.yaml#/Configuration
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "403":
        description: Caller lacks the authoritative role/ownership or new action is disabled.
        content:
          application/json:
            schema:
              $ref: ../../core-domain-service.yaml#/components/schemas/ForbiddenError
      "409":
        $ref: ./subscriptions.yaml#/Conflict
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/commerce.yaml#/ConfigurationInput
CMS:
  post:
    operationId: receiveCMSCommercialHint
    summary: Durably accept a CMS editorial synchronization hint
    description: Require the environment-specific CMS adapter bearer credential over TLS, isolated from
      user authentication. Authenticate before storing. Deduplicate trusted source/environment/event
      identity and reject changed payload for that identity with 409. Resolve only registered source
      mappings; never trust a CMS owner, price, license or grant claim. Persist receipt and audit
      before 200. Worker pulls canonical metadata through a read-only CMS credential, validates core
      revision/rights and reconciles; source timestamps do not establish ordering. Unprovisioned or
      disabled CMS integration cannot expand rights. Native Strapi payloads must pass through the
      configured adapter; this contract does not assume Strapi emits a signed canonical envelope.
    tags:
      - Commerce
    security:
      - CMSAdapterAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/commerce.yaml#/SyncHint
    responses:
      "200":
        description: Durable transport receipt, not synchronization completion.
        content:
          application/json:
            schema:
              $ref: ../schemas/commerce.yaml#/SyncReceipt
      "400":
        $ref: ./subscriptions.yaml#/InvalidRequest
      "401":
        $ref: ./subscriptions.yaml#/Unauthenticated
      "409":
        $ref: ./subscriptions.yaml#/Conflict
      "503":
        $ref: ./subscriptions.yaml#/Unavailable
