<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="keyboard-names-title keyboard-names-desc"><title id="keyboard-names-title">Dó4 a Dó5 no teclado</title><desc id="keyboard-names-desc">Teclas brancas de C4 a C5: Dó, Ré, Mi, Fá, Sol, Lá, Si, Dó. Grupos de duas e três teclas pretas orientam a localização. C4 e C5 têm o mesmo nome em oitavas diferentes.</desc><defs><marker id="keyboard-names-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6D28E0"/></marker></defs><rect width="1120" height="380" fill="#FBFAFF"/><g font-family="Manrope, Arial, sans-serif" fill="#05072C"><text x="32" y="42" font-size="30" fill="#05072C" text-anchor="start" font-weight="700">Nomes das notas no teclado</text><rect x="96" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="154" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Dó</text><text x="154" y="321" font-size="21" fill="#05072C" text-anchor="middle">C4</text><rect x="212" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="270" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Ré</text><text x="270" y="321" font-size="21" fill="#05072C" text-anchor="middle">D4</text><rect x="328" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="386" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Mi</text><text x="386" y="321" font-size="21" fill="#05072C" text-anchor="middle">E4</text><rect x="444" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="502" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Fá</text><text x="502" y="321" font-size="21" fill="#05072C" text-anchor="middle">F4</text><rect x="560" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="618" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Sol</text><text x="618" y="321" font-size="21" fill="#05072C" text-anchor="middle">G4</text><rect x="676" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="734" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Lá</text><text x="734" y="321" font-size="21" fill="#05072C" text-anchor="middle">A4</text><rect x="792" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="850" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Si</text><text x="850" y="321" font-size="21" fill="#05072C" text-anchor="middle">B4</text><rect x="908" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="966" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Dó</text><text x="966" y="321" font-size="21" fill="#05072C" text-anchor="middle">C5</text><rect x="180" y="95" width="64" height="145" fill="#05072C"/><rect x="296" y="95" width="64" height="145" fill="#05072C"/><rect x="528" y="95" width="64" height="145" fill="#05072C"/><rect x="644" y="95" width="64" height="145" fill="#05072C"/><rect x="760" y="95" width="64" height="145" fill="#05072C"/></g></svg>
