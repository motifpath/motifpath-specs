<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="guitar-distances-title guitar-distances-desc"><title id="guitar-distances-title">Guitarra: distâncias na corda Mi</title><desc id="guitar-distances-desc">6 cordas, da primeira em cima à Mi grave embaixo. Pestana à esquerda. Corda Mi solta: E2. Casa 1: F2. Casa 2: F♯2. Casa 3: G2. Os pontos ficam entre os trastes; o círculo aberto representa a corda solta. Mi a Fá tem um semitom; Fá a Sol tem dois.</desc><defs><marker id="guitar-distances-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6D28E0"/></marker></defs><rect width="1000" height="465" fill="#FBFAFF"/><g font-family="Manrope, Arial, sans-serif" fill="#05072C"><text x="28" y="38" font-size="29" fill="#05072C" text-anchor="start" font-weight="700">Guitarra · seis cordas · afinação padrão</text><text x="28" y="78" font-size="20" fill="#05072C" text-anchor="start">Braço de frente. Corda Mi grave: 6ª corda, linha inferior mais grossa.</text><rect x="200" y="128" width="660" height="199" fill="#EEE7DF" stroke="#807A91"/><line x1="420" x2="420" y1="128" y2="327" stroke="#807A91" stroke-width="4"/><line x1="640" x2="640" y1="128" y2="327" stroke="#807A91" stroke-width="4"/><line x1="860" x2="860" y1="128" y2="327" stroke="#807A91" stroke-width="4"/><rect x="196" y="128" width="8" height="199" fill="#D2C29E" stroke="#05072C"/><text x="25" y="147" font-size="20" fill="#05072C" text-anchor="start">1ª Mi</text><line x1="200" x2="860" y1="140" y2="140" stroke="#807A91" stroke-width="2"/><text x="25" y="182" font-size="20" fill="#05072C" text-anchor="start">2ª Si</text><line x1="200" x2="860" y1="175" y2="175" stroke="#807A91" stroke-width="2"/><text x="25" y="217" font-size="20" fill="#05072C" text-anchor="start">3ª Sol</text><line x1="200" x2="860" y1="210" y2="210" stroke="#807A91" stroke-width="2"/><text x="25" y="252" font-size="20" fill="#05072C" text-anchor="start">4ª Ré</text><line x1="200" x2="860" y1="245" y2="245" stroke="#807A91" stroke-width="2"/><text x="25" y="287" font-size="20" fill="#05072C" text-anchor="start">5ª Lá</text><line x1="200" x2="860" y1="280" y2="280" stroke="#807A91" stroke-width="2"/><text x="25" y="322" font-size="20" fill="#6D28E0" text-anchor="start" font-weight="700">6ª Mi</text><line x1="200" x2="860" y1="315" y2="315" stroke="#6D28E0" stroke-width="7"/><text x="150" y="114" font-size="21" fill="#05072C" text-anchor="middle">0 · solta</text><text x="310" y="114" font-size="21" fill="#05072C" text-anchor="middle">1ª casa</text><text x="530" y="114" font-size="21" fill="#05072C" text-anchor="middle">2ª casa</text><text x="750" y="114" font-size="21" fill="#05072C" text-anchor="middle">3ª casa</text><circle cx="150" cy="315" r="17" fill="#FBFAFF" stroke="#6D28E0" stroke-width="3"/><text x="150" y="374" font-size="25" fill="#05072C" text-anchor="middle" font-weight="700">Mi · E2</text><circle cx="310" cy="315" r="17" fill="#6D28E0" stroke="#6D28E0" stroke-width="3"/><text x="310" y="322" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="310" y="374" font-size="25" fill="#05072C" text-anchor="middle" font-weight="700">Fá · F2</text><circle cx="530" cy="315" r="17" fill="#6D28E0" stroke="#6D28E0" stroke-width="3"/><text x="530" y="322" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="530" y="374" font-size="25" fill="#05072C" text-anchor="middle" font-weight="700">Fá♯ · F♯2</text><circle cx="750" cy="315" r="17" fill="#6D28E0" stroke="#6D28E0" stroke-width="3"/><text x="750" y="322" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="750" y="374" font-size="25" fill="#05072C" text-anchor="middle" font-weight="700">Sol · G2</text><text x="200" y="344" font-size="17" fill="#807A91" text-anchor="middle">pestana</text><line x1="150" y1="403" x2="306" y2="403" stroke="#6D28E0" stroke-width="3" marker-end="url(#guitar-distances-arrow)"/><text x="230" y="437" font-size="21" fill="#6D28E0" text-anchor="middle" font-weight="700">1 semitom</text><line x1="310" y1="403" x2="746" y2="403" stroke="#6D28E0" stroke-width="3" marker-end="url(#guitar-distances-arrow)"/><text x="530" y="437" font-size="21" fill="#6D28E0" text-anchor="middle" font-weight="700">2 semitons / 1 tom</text></g></svg>
