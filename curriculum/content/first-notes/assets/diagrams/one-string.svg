<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Notas na sexta corda</title><desc id="desc">Somente a sexta corda: Mi solta, Fá casa 1, Fá sustenido casa 2, Sol casa 3, Sol sustenido casa 4 e Lá casa 5. A posição zero está antes da pestana.</desc><rect width="1280" height="420" fill="#FBFAFF"/><g font-family="Manrope, sans-serif" fill="#1A1633"><text x="40" y="60" font-size="34" font-weight="700">Sexta corda: Mi grave, afinação padrão</text><path d="M80 190 H1200" stroke="#5B5470" stroke-width="4"/><path d="M220 120 V260" stroke="#1A1633" stroke-width="7"/><path d="M410 130 V250" stroke="#5B5470" stroke-width="2"/><path d="M600 130 V250" stroke="#5B5470" stroke-width="2"/><path d="M790 130 V250" stroke="#5B5470" stroke-width="2"/><path d="M980 130 V250" stroke="#5B5470" stroke-width="2"/><path d="M1170 130 V250" stroke="#5B5470" stroke-width="2"/><circle cx="110" cy="190" r="25" fill="#6D28E0"/><text x="110" y="199" text-anchor="middle" fill="white" font-size="23">0</text><text x="110" y="310" text-anchor="middle" font-size="32">Mi</text><circle cx="315" cy="190" r="25" fill="#6D28E0"/><text x="315" y="199" text-anchor="middle" fill="white" font-size="23">1</text><text x="315" y="310" text-anchor="middle" font-size="32">Fá</text><circle cx="505" cy="190" r="25" fill="#6D28E0"/><text x="505" y="199" text-anchor="middle" fill="white" font-size="23">2</text><text x="505" y="310" text-anchor="middle" font-size="32">Fá♯</text><circle cx="695" cy="190" r="25" fill="#6D28E0"/><text x="695" y="199" text-anchor="middle" fill="white" font-size="23">3</text><text x="695" y="310" text-anchor="middle" font-size="32">Sol</text><circle cx="885" cy="190" r="25" fill="#6D28E0"/><text x="885" y="199" text-anchor="middle" fill="white" font-size="23">4</text><text x="885" y="310" text-anchor="middle" font-size="32">Sol♯</text><circle cx="1075" cy="190" r="25" fill="#6D28E0"/><text x="1075" y="199" text-anchor="middle" fill="white" font-size="23">5</text><text x="1075" y="310" text-anchor="middle" font-size="32">Lá</text><text x="40" y="385" font-size="24">0 = corda solta. Uma casa sobe um semitom. Duas casas somam um tom.</text></g></svg>