<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Doze semitons</title><desc id="desc">Sequência cromática de Dó até o Dó seguinte; posições 0 a 12, em passos iguais de semitom.</desc><rect width="1280" height="420" fill="#FBFAFF"/><g font-family="Manrope, sans-serif" fill="#1A1633"><text x="40" y="62" font-size="34" font-weight="700">Uma oitava em 12 semitons</text><text x="40" y="175" font-size="29" fill="#6D28E0">Dó</text><text x="45" y="245" font-size="22">0</text><text x="134" y="175" font-size="19" fill="#1A1633">Dó♯/Ré♭</text><text x="139" y="245" font-size="22">1</text><text x="228" y="175" font-size="29" fill="#1A1633">Ré</text><text x="233" y="245" font-size="22">2</text><text x="322" y="175" font-size="19" fill="#1A1633">Ré♯/Mi♭</text><text x="327" y="245" font-size="22">3</text><text x="416" y="175" font-size="29" fill="#1A1633">Mi</text><text x="421" y="245" font-size="22">4</text><text x="510" y="175" font-size="29" fill="#1A1633">Fá</text><text x="515" y="245" font-size="22">5</text><text x="604" y="175" font-size="19" fill="#1A1633">Fá♯/Sol♭</text><text x="609" y="245" font-size="22">6</text><text x="698" y="175" font-size="29" fill="#1A1633">Sol</text><text x="703" y="245" font-size="22">7</text><text x="792" y="175" font-size="19" fill="#1A1633">Sol♯/Lá♭</text><text x="797" y="245" font-size="22">8</text><text x="886" y="175" font-size="29" fill="#1A1633">Lá</text><text x="891" y="245" font-size="22">9</text><text x="980" y="175" font-size="19" fill="#1A1633">Lá♯/Si♭</text><text x="985" y="245" font-size="22">10</text><text x="1074" y="175" font-size="29" fill="#1A1633">Si</text><text x="1079" y="245" font-size="22">11</text><text x="1168" y="175" font-size="29" fill="#6D28E0">Dó</text><text x="1173" y="245" font-size="22">12</text><text x="40" y="335" font-size="25">Cada número marca um deslocamento. O último Dó já inicia a próxima oitava.</text></g></svg>