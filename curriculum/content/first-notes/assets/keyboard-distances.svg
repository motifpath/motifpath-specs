<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="keyboard-distances-title keyboard-distances-desc"><title id="keyboard-distances-title">Um ou dois passos no teclado</title><desc id="keyboard-distances-desc">As teclas C4, D4, E4 e F4 aparecem com todas as teclas intermediárias. E4 e F4 são vizinhas. Entre C4 e D4 está C♯4, a mesma tecla que D♭4 neste sistema. Um passo E4–F4 é um semitom; dois passos C4–C♯4–D4 são um tom.</desc><defs><marker id="keyboard-distances-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6D28E0"/></marker></defs><rect width="1120" height="480" fill="#FBFAFF"/><g font-family="Manrope, Arial, sans-serif" fill="#05072C"><text x="32" y="42" font-size="30" fill="#05072C" text-anchor="start" font-weight="700">Contando cada mudança de tecla</text><rect x="96" y="95" width="116" height="240" fill="#E7D8FF" stroke="#05072C" stroke-width="2"/><text x="154" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Dó</text><text x="154" y="321" font-size="21" fill="#05072C" text-anchor="middle">C4</text><rect x="212" y="95" width="116" height="240" fill="#E7D8FF" stroke="#05072C" stroke-width="2"/><text x="270" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Ré</text><text x="270" y="321" font-size="21" fill="#05072C" text-anchor="middle">D4</text><rect x="328" y="95" width="116" height="240" fill="#E7D8FF" stroke="#05072C" stroke-width="2"/><text x="386" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Mi</text><text x="386" y="321" font-size="21" fill="#05072C" text-anchor="middle">E4</text><rect x="444" y="95" width="116" height="240" fill="#E7D8FF" stroke="#05072C" stroke-width="2"/><text x="502" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Fá</text><text x="502" y="321" font-size="21" fill="#05072C" text-anchor="middle">F4</text><rect x="560" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="618" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Sol</text><text x="618" y="321" font-size="21" fill="#05072C" text-anchor="middle">G4</text><rect x="676" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="734" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Lá</text><text x="734" y="321" font-size="21" fill="#05072C" text-anchor="middle">A4</text><rect x="792" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="850" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Si</text><text x="850" y="321" font-size="21" fill="#05072C" text-anchor="middle">B4</text><rect x="908" y="95" width="116" height="240" fill="#fff" stroke="#05072C" stroke-width="2"/><text x="966" y="289" font-size="27" fill="#05072C" text-anchor="middle" font-weight="700">Dó</text><text x="966" y="321" font-size="21" fill="#05072C" text-anchor="middle">C5</text><rect x="180" y="95" width="64" height="145" fill="#05072C"/><rect x="296" y="95" width="64" height="145" fill="#05072C"/><rect x="528" y="95" width="64" height="145" fill="#05072C"/><rect x="644" y="95" width="64" height="145" fill="#05072C"/><rect x="760" y="95" width="64" height="145" fill="#05072C"/><text x="212" y="165" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">C♯</text><text x="96" y="396" font-size="26" fill="#6D28E0" text-anchor="start" font-weight="700">Mi4 → Fá4: 1 mudança = 1 semitom</text><text x="96" y="444" font-size="26" fill="#6D28E0" text-anchor="start" font-weight="700">Dó4 → Dó♯4 → Ré4: 2 mudanças = 1 tom</text></g></svg>
